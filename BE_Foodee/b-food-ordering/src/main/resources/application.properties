spring.application.name=b-food-ordering

# --- DataSource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/foodee?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=vinh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA/Hibernate ---
# Database da import san -> khong cho Hibernate tu thay doi cau truc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Server ---
server.port=8080

# --- JWT ---
# Giu dung key theo code cua ban
jwt.secret=U7k2nVZQPHQ9F3tWzRzJQ3ZQFqA8rC2nL5m9X0pB6tR1yD8kS4vM1xN6cG7hJ2q
# Thoi gian song cua token = 7 ngay
jwt.expiration=604800000

# --- Groq API key (lay tu bien moi truong) ---
groq.api.key=${GROQ_API_KEY}

# --- CORS cho FE Vite (cong 5173) ---
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# --- Thymeleaf (neu khong dung template) ---
spring.thymeleaf.check-template-location=false

# --- Logging ---
logging.level.org.springframework.security=INFO

